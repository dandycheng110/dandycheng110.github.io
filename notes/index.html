<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的筆記 / My Notes</title>
  <meta name="description" content="Claude 生成筆記的收藏，依主題分類 / Claude-generated notes, by category">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main>
    <header class="site-head">
      <h1>我的筆記 / My Notes</h1>
      <p class="subtitle">Claude 協作筆記收藏，依主題分類 · A collection of Claude notes, by category</p>
      <span class="count" id="count">—</span>
    </header>

    <!-- 卡片由下方 NOTES 清單自動產生 / cards are rendered from the NOTES list below -->
    <div id="board"></div>
    <noscript><p style="color:var(--muted)">此頁需要 JavaScript 來列出筆記。各篇筆記本身為靜態頁，可直接用網址開啟，例如 <code>notes/ai-agent-security/</code>。</p></noscript>
  </main>

  <footer>
    由 克勞德先生 協助整理 · Built with 克勞德先生
  </footer>

  <script>
  /* =======================================================================
     維護就改這兩個清單 / TO MAINTAIN, EDIT THESE TWO LISTS ONLY
     ----------------------------------------------------------------------
     ▸ 新增一篇 (Add):   在 NOTES 最後加一行 {slug, cat, title, desc}
                        並把該篇 HTML 放到  <slug>/index.html
     ▸ 刪除一篇 (Delete): 刪掉那一行，並刪掉  <slug>/  整個資料夾
     ▸ cat 必須是下面 CATEGORIES 其中一個 key
     計數、分類分組、空分類自動隱藏，全部自動處理。
     ======================================================================= */

  const CATEGORIES = [
    { key:'tech',   emoji:'💻', label:'技術 · 資安 · 自動化 / Tech & Security', color:'var(--c-tech)'   },

    { key:'career', emoji:'🎓', label:'學涯 · 事業 / Career & Business',          color:'var(--c-career)' },
    { key:'health', emoji:'💊', label:'健康 · 代購 / Health & Shopping',          color:'var(--c-health)' },
    { key:'travel', emoji:'🌊', label:'旅遊 / Travel',                            color:'var(--c-travel)' },
    { key:'learn',  emoji:'📚', label:'語言學習 / Language',                      color:'var(--c-learn)'  },
  ];

  const NOTES = [
    // 公開的筆記只列在這裡。私人筆記不放這、也不放在 repo，改用 /notes/private/ 登入閘。
    { slug:'nordic-time',        cat:'mind',   title:'《北歐時間》實踐學習單',       desc:'五種時間 × 輕盈成功四法則，可填寫、可匯出 Markdown' },
    { slug:'yudian-pocket-list', cat:'travel', title:'育典的旅遊式主動休息清單',     desc:'把旅遊變成「主動休息」的放鬆口袋清單 / Active-rest travel list' },
    { slug:'lean-management',     cat:'career', title:'《精實管理》學習單 ＋ 重點複習手冊', desc:'TPS 之屋 · 八大浪費 DOWNTIME · 五大原則 · 翻卡測驗，可勾選進度' },
    { slug:'think-and-grow-rich', cat:'mind',   title:'《思考致富》學習單 ＋ 複習手冊',     desc:'拿破崙·希爾 13 條成功白金法則 · 恐懼自評、可匯出 Markdown' },
    { slug:'trust-hernan-diaz',   cat:'mind',   title:'《信任》學習單 ＋ 重點複習手冊',     desc:'普立茲小說 · 四版真相對照、人物速記卡、自我測驗，可勾選進度' },
    { slug:'claude-code-plugins', cat:'tech',   title:'Claude Code 外掛百選',                desc:'官方市集 286 個裡挑出的 100 個 · 九區分類、可搜尋勾選，一次複製安裝指令' },
    { slug:'hdd-partner',        cat:'tech',   title:'AI 硬碟健康預警：合作邀請',            desc:'2026 全國 AI 專題競賽 · 免費硬碟健檢，換去識別化的 SMART 資料 · 附唯讀收集腳本' },
    { slug:'lipo-fire-poster',   cat:'tech',   title:'LiPo 電池冒煙應變海報',                desc:'A4 可列印 · 三步驟應變、沙桶／水／乾粉滅火器各做什麼，附 PDF 下載' },
    { slug:'f1-calculator',      cat:'tech',   title:'混淆矩陣 F1 計算機',                   desc:'填 TP／FN／FP／TN，即時算 F1、精確率、召回率，附代入過程與白話解讀' },
    { slug:'work-bgm',          cat:'mind',   title:'工作 BGM 手冊',                       desc:'為什麼高手工作時聽遊戲式 BGM · 十條說法反方查核 · YouTube Music 實查歌單 · 任務選擇器與兩週自我實驗' },
    { slug:'uav-cvss4',         cat:'tech',   title:'無人機 CVSS 4.0 資安漏洞評估模擬器',  desc:'專為 UAV 通訊鏈路（SDR / Wi-Fi / MAVLink）設計的雙系統衝擊評估工具，含 4 種典型攻擊情境預設' },
    { slug:'freelance-299-1020', cat:'career', title:'299 元接案模式拆解',                 desc:'Threads 創業貼文「別人報價 5 萬 我收 299 起」拆解 · 單位經濟 · 一週做完的技術做法 · 文案手法 · 市場行情 · 風險合規 · 怎麼複製' },
    { slug:'ordering-trainer-1020', cat:'learn', title:'點餐句型訓練器',                   desc:'英文「想吃／提議／想試／投票／委婉不同意」五種講法 · 句型卡、組句機、朗讀、填空練習、救援句，例句來自我的記帳表' },
    { slug:'real-photo-swap-1020', cat:'tech', title:'網站換成真實照片的方法',          desc:'以 hyrax.tw 蹄兔照為例 · 先查路線再下載 · 授權速查 · EXIF 驗真 · 照版位裁圖 · 分支隔離安全上線，附 11 張表' },
    { slug:'ros2-explained-1020', cat:'tech',  title:'ROS 2 白話入門：它不是機器人語言', desc:'三層比喻 · 5 個基本元件 · 訂閱／發布程式對照 · 切換發布者的互動小實驗 · 跟 MAVLink／MAVROS／micro-ROS 的關係 · 7 張整理表，附官方原文出處' },
    { slug:'founder-finance-map-1021', cat:'career', title:'會計 × 新創財務 × 總經 學習地圖', desc:'硬體新創創辦人「夠用」版 · 中文資源表 · EAS／營業稅／暫繳 6 件事 · SBIR 與青創貸款 · 33 個學習與實務的坑 · 3 個月與 6 個月學習路徑 · 一頁速查' },
    { slug:'career-map-1022', cat:'career', title:'職涯地圖課',                       desc:'職涯規劃五步驟上課筆記 · 盤點 · 方向 · 差距 · 行動 · 檢視 · 需密碼' },
    { slug:'energy-management-1025', cat:'mind', title:'〈能量管理入門〉查核報告',     desc:'涵泉AI 文章逐條查證 · 31 條說法、9 筆參考文獻稽核 · 5 個微行動證據分級與修正版做法 · 可勾選的做法清單' },
    { slug:'charisma-ladder-1027', cat:'mind',   title:'人格魅力 救援句學習單',           desc:'遇到這個情況先講這一句 · 24 個社交情境 × 五階救援句（照念→填空→開頭句→動作→收起來）· 可遮欄自測、A4 四頁可列印 · 4 週練習表與 10 題自測，附 10 條已核對出處' },
    { slug:'t200-checksheet-1029', cat:'tech',   title:'T200 推進器體檢表',              desc:'水下推進器 Blue Robotics T200 怎麼判斷正常 · 四關篩檢：看外觀 → 手轉＋短接 → 三組電阻 → 泡水通電比電流 · A4 橫式兩頁可列印（10 顆記錄表＋判讀小抄），附 PDF 下載與原廠出處' },
    { slug:'smolvla-1030', cat:'tech',   title:'SmolVLA 論文導讀',              desc:'Hugging Face 的小型機器人 VLA 模型 · 四階讀法、每格標 PDF 頁碼 · 可點的架構圖、非同步推論模擬器、成績單與消融開關台 · 附 SO-101 錄資料與評分的起點' },
  ];

  /* ---- 以下為渲染邏輯，平常不用動 / rendering — no need to edit ---- */
  (function render(){
    const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
    const board = document.getElementById('board');
    const usedCats = CATEGORIES.filter(c => NOTES.some(n => n.cat === c.key));
    board.innerHTML = usedCats.map(cat => {
      const items = NOTES.filter(n => n.cat === cat.key);
      const cards = items.map(n => `
        <a class="note-card" href="${encodeURI(n.slug)}/">
          <span class="title">${esc(n.title)}</span>
          <span class="desc">${esc(n.desc)}</span>
          <span class="go">開啟 →</span>
        </a>`).join('');
      return `<section class="category" style="--cat:${cat.color}">
          <div class="category-head">
            <span class="emoji">${cat.emoji}</span>
            <h2>${esc(cat.label)}</h2>
            <span class="n">${items.length}</span>
          </div>
          <div class="note-grid">${cards}</div>
        </section>`;
    }).join('');

    document.getElementById('count').textContent =
      `共 ${NOTES.length} 篇 · ${usedCats.length} 類 / ${NOTES.length} notes · ${usedCats.length} categories`;
  })();
  </script>
</body>
</html>
