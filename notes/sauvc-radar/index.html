<style>
:root { --bg: #f3f5f6; --surface: #ffffff; --ink: #18212c; --muted: #5b6672; --rule: #d8dde2; --grid: rgba(16, 97, 122, .12); --accent: #10617A; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1418; --surface: #171e24; --ink: #e5e9ed; --muted: #9ba6b1; --rule: #2a343d; --grid: rgba(87, 180, 206, .1); --accent: #57B4CE; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; padding-inline: 16px; display: grid; place-items: center; background-color: var(--bg); color: var(--ink);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 25px 25px;
  font-family: "PingFang TC", "Noto Sans TC", "Heiti TC", "Microsoft JhengHei", sans-serif; }
form { width: min(100%, 360px); background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 22px 20px; display: flex; flex-direction: column; gap: 12px; }
h1 { margin: 0; font-size: 1.2rem; }
p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.6; }
input[type=password] { font: inherit; font-size: 1rem; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); width: 100%; }
label.rem { display: flex; gap: 8px; align-items: center; font-size: .88rem; color: var(--muted); }
button { font: inherit; font-weight: 700; padding: 10px 12px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { color: var(--accent); font-size: .88rem; min-height: 1.2em; }
</style>
