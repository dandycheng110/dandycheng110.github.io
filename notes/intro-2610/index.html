<style>
:root { --bg: #f3f5f6; --surface: #ffffff; --ink: #18212c; --muted: #5b6672; --rule: #d8dde2; --grid: rgba(16, 97, 122, .12); --accent: #10617A; color-scheme: light; }

html, body { height: 100%; }
body { margin: 0; padding-inline: 16px; display: grid; place-items: center; background-color: var(--bg); color: var(--ink);

h1 { margin: 0; font-size: 1.2rem; }
p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.6; }
input[type=password] { font: inherit; font-size: 1rem; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); width: 100%; }
label.rem { display: flex; gap: 8px; align-items: center; font-size: .88rem; color: var(--muted); }
button { font: inherit; font-weight: 700; padding: 10px 12px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { color: var(--accent); font-size: .88rem; min-height: 1.2em; }

  async function unlock(pw) {
    var te = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: u8(DATA.salt), iterations: DATA.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(DATA.iv) }, key, u8(DATA.ct));
    return new TextDecoder().decode(pt);
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  var f = document.getElementById('f'), pw = document.getElementById('pw'), rem = document.getElementById('rem'), go = document.getElementById('go'), err = document.getElementById('err');
  if (!window.crypto || !crypto.subtle) { err.textContent = '這個瀏覽器不支援解密，請換 Safari 或 Chrome。'; go.disabled = true; return; }
  f.addEventListener('submit', async function (e) {
    e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = '解密中…';
    try {
      var html = await unlock(pw.value);
      try { if (rem.checked) localStorage.setItem(KEY, pw.value); else localStorage.removeItem(KEY); } catch (x) {}
      show(html);
    } catch (x) { err.textContent = '密碼不對，再試一次。'; go.disabled = false; go.textContent = '解鎖'; pw.select(); }
  });
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (x) {}
  if (saved) { pw.value = saved; rem.checked = true; unlock(saved).then(show).catch(function () { try { localStorage.removeItem(KEY); } catch (x) {} pw.value = ''; rem.checked = false; }); }
})();
</script>
