const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){const enc=new TextEncoder();const bk=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.salt),iterations:P.iter,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);
const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.iv)},k,u8(P.data));return new TextDecoder().decode(plain)}
async function tryPw(pw,quiet){const b=document.getElementById('go'),e=document.getElementById('err');b.disabled=true;e.textContent=quiet?'':'解密中…';
try{const html=await open(pw);try{sessionStorage.setItem('kobe_pw',pw)}catch(_){}document.open();document.write(html);document.close()}
catch(_){b.disabled=false;e.textContent=quiet?'':'密碼不對，再試一次。'}}
document.getElementById('f').addEventListener('submit',ev=>{ev.preventDefault();tryPw(document.getElementById('pw').value.trim(),false)});
try{const s=sessionStorage.getItem('kobe_pw');if(s)tryPw(s,true)}catch(_){}
</script></body></html>
